<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Booking Data</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #f1f1f1;
            line-height: 1.6;
        }
        .container {
            width: 90%;
            margin: 20px auto;
            padding: 40px;
            background-color: #1f1f1f;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #e0e0e0;
            font-size: 2rem;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 50px;
        }
        .section h2 {
            background-color: #444444;
            color: #ff9800;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1.4rem;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #333;
            color: #e0e0e0;
            text-transform: none;
            font-weight: bold;
        }
        td {
            background-color: #222;
            color: #e0e0e0;
        }
        tr:nth-child(even) td {
            background-color: #2a2a2a;
        }
        tr:hover {
            background-color: #333;
        }
        @media (max-width: 768px) {
            table {
                font-size: 14px;
            }
            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class='container'>
        <h1>Advance Booking Reports</h1>
        <div id="data"></div>
    </div>

    <script>
        async function fetchData() {
    
            const url = `https://www.sacnilk.com/quicknews/Sikandar_2025_First_Day_Advance_Booking_Report`;
            try {
                const response = await fetch(url);
                const text = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                
                let output = '';
                const sections = doc.querySelectorAll('h2');
                
                sections.forEach(section => {
                    let title = section.textContent;
                    let table = section.nextElementSibling;
                    
                    if (table && table.tagName.toLowerCase() === 'table') {
                        output += `<div class='section'><h2>${title}</h2><table><thead>`;
                        let rows = table.querySelectorAll('tr');
                        rows.forEach((row, index) => {
                            output += '<tr>';
                            row.querySelectorAll('td').forEach(cell => {
                                output += index === 0 ? `<th>${cell.textContent}</th>` : `<td>${cell.textContent}</td>`;
                            });
                            output += '</tr>';
                        });
                        output += '</thead></table></div>';
                    }
                });
                
                document.getElementById('data').innerHTML = output || '<p>No data available.</p>';
            } catch (error) {
                document.getElementById('data').innerHTML = '<p>Failed to fetch data.</p>';
            }
        }
        fetchData();
    </script>
</body>
</html>
